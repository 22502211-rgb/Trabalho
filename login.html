<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F4EB">
  <title>Login | Maison Saveur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="java.js"></script>
</head>
<body class="pagina-login">
  <main class="login-container">
    <section class="login-imagem" aria-label="Boas-vindas Maison Saveur">
      <img src="Ifood.png" alt="" />
    </section>
    <section class="login-formulario">
      <a class="voltar" href="index.html">← Voltar à página inicial</a>
      <div class="formulario-conteudo">
        <span class="sobrelinha">MAISON SAVEUR</span>
        <h2>Bonjour!<br><em>Que bom ter você aqui.</em></h2>
        <p>Entre na sua conta e aproveite todos os nossos sabores.</p>
        
        <form class="formulario" id="formularios">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
          
          <div class="linha-senha">
            <label for="senha">Senha</label>
            <a href="#aviso-demo"></a>
          </div>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
          
          <button class="botao botao-login" type="submit">
            Entrar na minha conta ↗
          </button>
        </form>
        
        
        <p class="login-cadastro">Ainda não tem conta? <a href="cadastro.html">Cadastro</a></p>
      </div>
      <span class="login-direitos">© 2026 Maison Saveur</span>
    </section>
  </main>
</body>
</html>
